[package]
name = "connect4-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "connect4-rs"
path = "src/main.rs"

[[bin]]
name = "connect4-mcp"
path = "src/mcp.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
